---
# Playbook: instala/atualiza o packetrank Discord bot
#
# O que este playbook faz:
#   1. Cria o usuário/grupo de sistema 'packetrank'
#   2. Adiciona nginx ao grupo packetrank
#   3. Cria /opt/packetrank com owner=nginx group=packetrank mode=2775
#      → nginx é dono: tar/scp podem alterar metadados do diretório (utime/chmod)
#      → packetrank acessa via grupo (leitura + execução dos arquivos do build)
#      → setgid (2xxx): novos arquivos herdam o grupo packetrank automaticamente
#   4. Configura sudoers para nginx gerenciar o serviço via systemctl
#   5. Ajusta contexto SELinux de httpd_sys_content_t → var_t
#      → resolve: SELinux bloqueia execução do node nessa pasta
#      var_t é acessível por unconfined_service_t (domínio padrão
#      de serviços customizados no RHEL/OL 9)
#   6. Instala/atualiza a unit systemd e reinicia o serviço
#
# Uso:
#   ansible-playbook -i inventory.ini playbook.yml
#
# Pré-requisitos:
#   pip install ansible
#   ansible-galaxy collection install ansible.posix community.general

- name: Install and configure packetrank Discord bot
  hosts: vps
  become: true

  vars:
    app_name: packetrank
    app_dir: /opt/packetrank
    app_user: packetrank
    app_group: packetrank
    deploy_user: nginx                  # usuário que faz o deploy (git pull, pnpm build)
    service_src: "{{ playbook_dir }}/../files/packetrank.service"

  tasks:

    # ── 1. Usuário e grupo de sistema ─────────────────────────────────────────

    - name: Create packetrank system group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true
        state: present

    - name: Create packetrank system user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        shell: /sbin/nologin
        home: "{{ app_dir }}"
        create_home: false
        state: present

    - name: Add deploy user to packetrank group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: "{{ app_group }}"
        append: true

    # ── 2. Diretório da aplicação ─────────────────────────────────────────────
    #
    # owner=nginx  → tar/scp podem alterar metadados do diretório (utime/chmod)
    # group=packetrank → serviço lê/executa os arquivos via grupo
    # mode=2775    → setgid: novos arquivos herdam o grupo automaticamente

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ app_group }}"
        mode: "2775"

    # ── 3. Sudoers: nginx pode gerenciar o serviço ────────────────────────────

    - name: Allow {{ deploy_user }} to manage packetrank service via systemctl
      ansible.builtin.copy:
        dest: /etc/sudoers.d/{{ deploy_user }}-{{ app_name }}
        content: |
          # Gerado pelo Ansible — não edite manualmente
          # Permite que {{ deploy_user }} gerencie apenas o serviço packetrank
          {{ deploy_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl start {{ app_name }}.service
          {{ deploy_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl stop {{ app_name }}.service
          {{ deploy_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl restart {{ app_name }}.service
          {{ deploy_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl status {{ app_name }}.service
          {{ deploy_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl daemon-reload
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    # ── 4. SELinux ────────────────────────────────────────────────────────────
    #
    # O diretório /opt/packetrank precisa de var_t para que unconfined_service_t
    # (domínio padrão de units systemd no RHEL/OL 9) possa ler e executar os
    # arquivos. httpd_sys_content_t (usado antes) só funciona para o Apache.
    #
    # Dependência: collection community.general

    - name: Install SELinux management utilities
      ansible.builtin.package:
        name:
          - policycoreutils-python-utils   # fornece semanage
          - python3-libsemanage            # binding Python para semanage
        state: present
      when: ansible_facts["selinux"]["status"] == "enabled"

    - name: Set SELinux file context for app directory (var_t)
      community.general.sefcontext:
        target: "{{ app_dir }}(/.*)?"
        setype: var_t
        state: present
      when: ansible_facts["selinux"]["status"] == "enabled"
      notify: Restore SELinux contexts

    # ── 5. Systemd unit ───────────────────────────────────────────────────────

    - name: Install packetrank systemd unit
      ansible.builtin.copy:
        src: "{{ service_src }}"
        dest: /etc/systemd/system/{{ app_name }}.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd daemon
        - Restart packetrank service

    - name: Enable packetrank service
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        daemon_reload: true

    - name: Check if app build exists
      ansible.builtin.stat:
        path: "{{ app_dir }}/dist/index.js"
      register: app_build

    - name: Ensure packetrank service is started
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: started
      when: app_build.stat.exists

    - name: Warn if app is not deployed yet
      ansible.builtin.debug:
        msg: >-
          Serviço não iniciado: {{ app_dir }}/dist/index.js não encontrado.
          Execute o deploy (git pull + pnpm build) e então: systemctl start {{ app_name }}
      when: not app_build.stat.exists

  # ── Handlers ─────────────────────────────────────────────────────────────────

  handlers:

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restore SELinux contexts
      ansible.builtin.command: restorecon -Rv "{{ app_dir }}"
      register: restorecon_out
      changed_when: "'Relabeled' in restorecon_out.stdout"

    - name: Restart packetrank service
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted
